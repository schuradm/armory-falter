name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Pint & PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, zip, bcmath, sodium, pdo_mysql
          coverage: none

      - name: Composer-Abhängigkeiten installieren
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Code-Stil (Pint)
        # vorübergehend nur Hinweis, bis der Bestand einmal formatiert ist
        continue-on-error: true
        run: vendor/bin/pint --test

      - name: Statische Analyse (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

  tests:
    name: Tests (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: armory_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: armory_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, zip, bcmath, sodium, pdo_mysql
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Composer-Abhängigkeiten installieren
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Frontend bauen
        run: npm ci && npm run build

      - name: Umgebung vorbereiten
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests
        run: php artisan test
